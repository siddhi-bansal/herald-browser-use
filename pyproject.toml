[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herald-browser-use"
version = "0.2.0"
description = "Let your browser-use agent report where it got stuck on a website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siddhi Bansal" }]
requires-python = ">=3.11"
dependencies = ["browser-use>=0.13,<0.14", "httpx>=0.27"]
keywords = ["browser-use", "ai-agents", "web-agents", "friction", "herald"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/siddhi-bansal/herald-browser-use"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/herald_browser_use"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
